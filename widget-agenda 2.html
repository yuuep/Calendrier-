<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bordeaux: #340a12;
    --bordeaux-clair: #6b1a2a;
    --creme: #f1e8df;
    --blanc: #ffffff;
    --doux: rgba(52, 10, 18, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--bordeaux);
    display: flex;
    justify-content: center;
    padding: 10px 24px;
  }
  .cadre { position: relative; width: 250px; }
  .cadre::before, .cadre::after {
    content: '✦';
    position: absolute;
    top: 46%;
    font-size: 14px;
    color: var(--bordeaux);
  }
  .cadre::before { left: -18px; }
  .cadre::after { right: -18px; }
  .arche {
    border: 2px solid var(--bordeaux);
    border-radius: 125px 125px 0 0;
    background: var(--blanc);
    padding: 9px;
  }
  .interieur {
    background: var(--creme);
    border-radius: 116px 116px 0 0;
    padding: 46px 16px 16px;
  }
  .mois {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .mois h1 {
    font-style: italic;
    font-weight: 500;
    font-size: 20px;
    text-transform: capitalize;
  }
  .fleche {
    background: none; border: none;
    font-family: inherit; font-size: 18px;
    color: var(--bordeaux); cursor: pointer;
    width: 24px; height: 24px; border-radius: 50%;
  }
  .fleche:focus-visible, .jour:focus-visible, .ajout button:focus-visible {
    outline: 1.5px solid var(--bordeaux); outline-offset: 1px;
  }
  .grille {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
  }
  .nom-jour { font-size: 12px; font-style: italic; color: var(--doux); padding-bottom: 2px; }
  .jour {
    position: relative;
    background: none; border: none;
    font-family: inherit; font-size: 14px;
    color: var(--bordeaux);
    aspect-ratio: 1;
    border-radius: 50%;
    cursor: pointer;
  }
  .jour.autre { visibility: hidden; }
  .jour.aujourdhui { background: var(--bordeaux); color: var(--creme); font-weight: 600; }
  .jour.choisi:not(.aujourdhui) { box-shadow: inset 0 0 0 1.2px var(--bordeaux); }
  .jour.evenement::after {
    content: '';
    position: absolute;
    bottom: 2px; left: 50%;
    width: 4px; height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: var(--bordeaux-clair);
  }
  .jour.aujourdhui.evenement::after { background: var(--creme); }

  .detail {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(52, 10, 18, 0.2);
  }
  .detail h2 { font-style: italic; font-weight: 500; font-size: 15px; text-align: center; margin-bottom: 6px; }
  .liste { list-style: none; max-height: 96px; overflow-y: auto; }
  .liste li {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 15px; padding: 2px 0;
  }
  .liste li button {
    background: none; border: none; color: var(--doux);
    font-size: 14px; cursor: pointer; padding-left: 6px;
  }
  .vide { font-size: 14px; font-style: italic; color: var(--doux); text-align: center; }
  .ajout { display: flex; gap: 6px; margin-top: 8px; }
  .ajout input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 14px;
    color: var(--bordeaux);
    background: var(--blanc);
    border: 1px solid rgba(52, 10, 18, 0.3);
    border-radius: 12px;
    padding: 4px 10px;
  }
  .ajout input::placeholder { color: var(--doux); font-style: italic; }
  .ajout input:focus { outline: 1.5px solid var(--bordeaux); }
  .ajout button {
    font-family: inherit; font-size: 15px;
    background: var(--bordeaux); color: var(--creme);
    border: none; border-radius: 12px;
    padding: 4px 10px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="cadre">
    <div class="arche">
      <div class="interieur">
        <div class="mois">
          <button class="fleche" id="prec" type="button" aria-label="Mois précédent">‹</button>
          <h1 id="titre"></h1>
          <button class="fleche" id="suiv" type="button" aria-label="Mois suivant">›</button>
        </div>
        <div class="grille" id="grille"></div>
        <div class="detail">
          <h2 id="jour-titre"></h2>
          <ul class="liste" id="liste"></ul>
          <div class="ajout">
            <input id="texte" type="text" placeholder="Ajouter…" maxlength="60">
            <button id="ajouter" type="button" aria-label="Ajouter">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const CLE = 'agenda-evenements';
  let evenements = {};
  try { evenements = JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) {}
  const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(evenements)); } catch (e) {} };

  const pad = n => String(n).padStart(2, '0');
  const cleDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  const aujourdhui = new Date();
  aujourdhui.setHours(0, 0, 0, 0);
  let vue = new Date(aujourdhui.getFullYear(), aujourdhui.getMonth(), 1);
  let choisi = new Date(aujourdhui);

  const grille = document.getElementById('grille');

  function afficherMois() {
    document.getElementById('titre').textContent =
      vue.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    grille.innerHTML = ['L', 'M', 'M', 'J', 'V', 'S', 'D']
      .map(j => `<span class="nom-jour">${j}</span>`).join('');

    const decalage = (vue.getDay() + 6) % 7;
    const nbJours = new Date(vue.getFullYear(), vue.getMonth() + 1, 0).getDate();
    for (let i = 0; i < decalage; i++) {
      grille.insertAdjacentHTML('beforeend', '<button class="jour autre" tabindex="-1" aria-hidden="true"></button>');
    }
    for (let n = 1; n <= nbJours; n++) {
      const d = new Date(vue.getFullYear(), vue.getMonth(), n);
      const k = cleDate(d);
      const classes = ['jour'];
      if (k === cleDate(aujourdhui)) classes.push('aujourdhui');
      if (k === cleDate(choisi)) classes.push('choisi');
      if (evenements[k] && evenements[k].length) classes.push('evenement');
      grille.insertAdjacentHTML('beforeend',
        `<button class="${classes.join(' ')}" type="button" data-k="${k}">${n}</button>`);
    }
  }

  function afficherJour() {
    const k = cleDate(choisi);
    document.getElementById('jour-titre').textContent =
      choisi.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const liste = document.getElementById('liste');
    const items = evenements[k] || [];
    liste.innerHTML = items.length
      ? items.map((t, i) => `<li><span></span><button type="button" data-i="${i}" aria-label="Supprimer">×</button></li>`).join('')
      : '<li class="vide">Rien de prévu</li>';
    liste.querySelectorAll('li span').forEach((s, i) => s.textContent = items[i]);
  }

  function tout() { afficherMois(); afficherJour(); }

  grille.addEventListener('click', e => {
    const k = e.target.dataset.k;
    if (!k) return;
    const [a, m, j] = k.split('-').map(Number);
    choisi = new Date(a, m - 1, j);
    tout();
  });

  document.getElementById('liste').addEventListener('click', e => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    const k = cleDate(choisi);
    evenements[k].splice(Number(i), 1);
    if (!evenements[k].length) delete evenements[k];
    sauver(); tout();
  });

  function ajouter() {
    const champ = document.getElementById('texte');
    const t = champ.value.trim();
    if (!t) return;
    const k = cleDate(choisi);
    (evenements[k] = evenements[k] || []).push(t);
    champ.value = '';
    sauver(); tout();
  }
  document.getElementById('ajouter').addEventListener('click', ajouter);
  document.getElementById('texte').addEventListener('keydown', e => { if (e.key === 'Enter') ajouter(); });

  document.getElementById('prec').addEventListener('click', () => { vue.setMonth(vue.getMonth() - 1); afficherMois(); });
  document.getElementById('suiv').addEventListener('click', () => { vue.setMonth(vue.getMonth() + 1); afficherMois(); });

  tout();
</script>
</body>
</html>
